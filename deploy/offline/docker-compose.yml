version: '3.8'

services:
  # Azure Cosmos DB Linux Emulator
  # NOTE: Commented out for Azure Free Tier usage (Option 2)
  # The Linux emulator is non-functional on macOS with Docker Desktop
  # See docs/phase1-cosmos-emulator-workarounds.md for details
  # Uncomment this section if using Windows Cosmos DB Emulator or on Linux
  #
  # cosmosdb:
  #   image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
  #   container_name: tre-cosmosdb-emulator
  #   hostname: cosmosdb
  #   platform: linux/amd64
  #   ports:
  #     - "8081:8081"
  #     - "10250-10255:10250-10255"
  #   environment:
  #     - AZURE_COSMOS_EMULATOR_PARTITION_COUNT=10
  #     - AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE=true
  #     - AZURE_COSMOS_EMULATOR_IP_ADDRESS_OVERRIDE=cosmosdb
  #   volumes:
  #     - cosmosdb-data:/data/db
  #   healthcheck:
  #     test: ["CMD", "curl", "-k", "-f", "https://cosmosdb:8081/_explorer/index.html"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 30
  #     start_period: 60s
  #   networks:
  #     - tre-local

  # Azurite (Azure Storage Emulator)
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: tre-azurite
    hostname: azurite
    ports:
      - "10000:10000"  # Blob service
      - "10001:10001"  # Queue service
      - "10002:10002"  # Table service
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --loose --skipApiVersionCheck"
    volumes:
      - azurite-data:/data
    networks:
      - tre-local

  # RabbitMQ (Message Queue & Event Bus)
  rabbitmq:
    image: rabbitmq:3-management
    container_name: tre-rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=tre_user
      - RABBITMQ_DEFAULT_PASS=tre_password
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - tre-local

  # Keycloak (Authentication & Identity Management)
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: tre-keycloak
    hostname: keycloak
    ports:
      - "8080:8080"   # Keycloak UI & API
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin_password
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME_STRICT=false
    command: start-dev
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./seed/AzureTRE-realm.json:/opt/keycloak/data/import/AzureTRE-realm.json:ro
    networks:
      - tre-local

  # HashiCorp Vault (Secrets Management)
  vault:
    image: hashicorp/vault:latest
    container_name: tre-vault
    hostname: vault
    ports:
      - "8200:8200"   # Vault API & UI
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=root-token
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - VAULT_ADDR=http://0.0.0.0:8200
      - SKIP_SETCAP=true
    command: server -dev
    volumes:
      - ./seed/vault-init.sh:/vault/init/vault-init.sh:ro
    networks:
      - tre-local

  # TRE API Application
  tre-api:
    build:
      context: ../../api_app
      dockerfile: Dockerfile
    container_name: tre-api
    hostname: tre-api
    ports:
      - "8000:8000"
    environment:
      # Deployment mode
      - DEPLOYMENT_MODE=offline

      # Cosmos DB connection
      # When using local emulator (uncomment cosmosdb service above):
      # - COSMOSDB_ACCOUNT_NAME=localhost
      # - COSMOSDB_ACCOUNT_URI=https://cosmosdb:8081
      # - STATE_STORE_ENDPOINT=https://cosmosdb:8081
      # - STATE_STORE_KEY=C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==

      # When using Azure Cosmos DB Free Tier (Option 2):
      # Set these via .env file or environment variables:
      - COSMOSDB_ACCOUNT_NAME=${COSMOSDB_ACCOUNT_NAME}
      - STATE_STORE_ENDPOINT=${STATE_STORE_ENDPOINT}
      - STATE_STORE_KEY=${STATE_STORE_KEY}

      # Azurite connection
      - AZURE_STORAGE_ACCOUNT_NAME=devstoreaccount1
      - AZURE_STORAGE_CONNECTION_STRING=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;

      # RabbitMQ connection (replaces Azure Service Bus in offline mode)
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=tre_user
      - RABBITMQ_PASSWORD=tre_password
      - RABBITMQ_VHOST=/

      # Keycloak connection (replaces Azure AD in offline mode)
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=AzureTRE
      - KEYCLOAK_CLIENT_ID=tre-api-client
      - KEYCLOAK_CLIENT_SECRET=tre-api-client-secret

      # HashiCorp Vault connection (replaces Azure Key Vault in offline mode)
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root-token

      # Observability (OpenTelemetry to Jaeger)
      - OTEL_EXPORTER_JAEGER_ENDPOINT=http://jaeger:14268/api/traces
      - OTEL_SERVICE_NAME=tre-api
      - OTEL_TRACES_EXPORTER=jaeger

      # Disable Azure-specific features for local mode
      - ENABLE_AIRLOCK=false
      - ENABLE_SWAGGER=true
      - API_DEBUG=true
    depends_on:
      # cosmosdb:
      #   condition: service_started  # Uncomment if using local emulator
      azurite:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - tre-local
    volumes:
      - ../../api_app:/app
      - /var/run/docker.sock:/var/run/docker.sock  # For future resource processor integration

  # Docker Registry (Container Registry for Porter bundles)
  registry:
    image: registry:2
    container_name: tre-registry
    hostname: registry
    ports:
      - "5001:5000"   # Registry API (5001 on host to avoid macOS AirPlay conflict)
    environment:
      - REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY=/var/lib/registry
      - REGISTRY_HTTP_ADDR=0.0.0.0:5000
    volumes:
      - registry-data:/var/lib/registry
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/v2/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - tre-local
    restart: unless-stopped

  # Traefik (Reverse Proxy & Load Balancer for workspace routing)
  traefik:
    image: traefik:v2.10
    container_name: tre-traefik
    hostname: traefik
    ports:
      - "80:80"       # HTTP
      - "443:443"     # HTTPS
      - "8090:8080"   # Dashboard
    environment:
      - TZ=UTC
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Docker socket for service discovery
      - ./traefik.yml:/etc/traefik/traefik.yml:ro     # Static configuration
      - traefik-certificates:/etc/traefik/certificates
    command:
      - --configFile=/etc/traefik/traefik.yml
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.tre.local`)"
      - "traefik.http.routers.dashboard.service=api@internal"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - tre-local
    restart: unless-stopped

  # Jaeger (Distributed Tracing)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: tre-jaeger
    hostname: jaeger
    ports:
      - "5775:5775/udp"   # Zipkin compact thrift
      - "6831:6831/udp"   # Jaeger compact thrift
      - "6832:6832/udp"   # Jaeger binary thrift
      - "5778:5778"       # Serve configs
      - "16686:16686"     # Jaeger UI
      - "14268:14268"     # Jaeger collector HTTP
      - "14250:14250"     # Jaeger gRPC
      - "9411:9411"       # Zipkin compatible endpoint
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - tre-local
    restart: unless-stopped

  # Loki (Log Aggregation)
  loki:
    image: grafana/loki:latest
    container_name: tre-loki
    hostname: loki
    ports:
      - "3100:3100"       # Loki API
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    networks:
      - tre-local
    restart: unless-stopped

  # Grafana (Monitoring Dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: tre-grafana
    hostname: grafana
    ports:
      - "3001:3000"       # Grafana UI (mapped to 3001 to avoid conflict with MCP server)
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - tre-local
    depends_on:
      - loki
      - jaeger
    restart: unless-stopped

  # TRE Resource Processor (Local)
  tre-resource-processor:
    build:
      context: ../../resource_processor/local_runner
      dockerfile: Dockerfile
    container_name: tre-resource-processor
    hostname: tre-resource-processor
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=tre_user
      - RABBITMQ_PASSWORD=tre_password
      - RABBITMQ_VHOST=/
      - REGISTRY_URL=http://registry:5000
    depends_on:
      rabbitmq:
        condition: service_healthy
      registry:
        condition: service_healthy
    networks:
      - tre-local
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Docker-in-Docker for Porter
    restart: unless-stopped

networks:
  tre-local:
    name: tre-local
    driver: bridge

volumes:
  # cosmosdb-data:
  #   name: tre-cosmosdb-data  # Uncomment if using local emulator
  azurite-data:
    name: tre-azurite-data
  rabbitmq-data:
    name: tre-rabbitmq-data
  keycloak-data:
    name: tre-keycloak-data
  registry-data:
    name: tre-registry-data
  traefik-certificates:
    name: tre-traefik-certificates
  loki-data:
    name: tre-loki-data
  grafana-data:
    name: tre-grafana-data